name: 금감원 보도자료 알림

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 조금 늦어질 수 있음)
  workflow_dispatch:          # 직접 실행 버튼
    inputs:
      test:
        description: "가장 최근 글 1건을 시험으로 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fss-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 필요한 프로그램 설치
        run: pip install requests beautifulsoup4

      - name: 새 글 확인
        run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEND_TEST: ${{ inputs.test && '1' || '0' }}

      - name: 확인한 글 목록 저장
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json 2>/dev/null || exit 0
          git diff --cached --quiet || (git commit -m "확인한 글 목록 갱신" && git push)
